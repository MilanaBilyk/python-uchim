<script>
var L=[
{t:"Среда и первые программы",s:"IDLE, print, input, числа",
idea:"Python — язык, на котором ты даёшь компьютеру команды. IDLE — программа, где ты их пишешь. Есть два режима: интерактивный (окно с >>>, каждая команда выполняется сразу, как калькулятор) и файл с программой (пишешь много команд, потом запускаешь через F5). Переменная — это коробочка с именем, в которой лежит значение: x = 5. Всё, что после #, — комментарий, Python его пропускает. Главное, что надо знать: input() всегда возвращает строку, поэтому число из него надо превратить через int() или float().",
code:"a = int(input('Введите a: '))\nb = int(input('Введите b: '))\nprint('Сумма =', a + b)\n\n20 / 3    # 6.666... (деление всегда дробное)\n20 // 3   # 6   (целая часть)\n20 % 3    # 2   (остаток)\n3 ** 4    # 81  (степень)",
mem:["/ — обычное деление, // — целая часть, % — остаток, ** — степень","input() даёт строку, число делаем через int() или float()","= это не «равно», а «положи значение в переменную»"],
cards:[["Что делает //?","Целочисленное деление: 20 // 3 = 6"],["Что вернёт input()?","Всегда строку (str), даже если ввели 5"],["Для чего нужен #?","Комментарий: Python его не выполняет"]],
quiz:[["Чему равно 20 // 3?",["6.67","6","2"],1,"// отбрасывает дробную часть. Остаток от деления — это %."],["Как правильно прочитать целое число?",["a = input()","a = int(input())","a = str(input())"],1,"input() даёт строку, int() превращает её в число."]],
say:"Объясни подруге, чем отличаются /, // и %, и почему input() надо оборачивать в int()."},
{t:"Условные операторы",s:"if, elif, else, and, or, not",
idea:"Условие — это вопрос, на который отвечают «да» (True) или «нет» (False). Сравнения: ==, !=, >, <, >=, <=. Помни: один = кладёт значение, два == сравнивает. Условия можно склеивать: and (оба верны), or (хотя бы одно верно), not (наоборот). if выполняет блок, если условие верно; elif проверяется, только если предыдущие были ложны; else — если ничего не подошло. Блок выделяется отступом (4 пробела) и двоеточием в конце строки. В Python 0 считается ложью, любое другое число — истиной.",
code:"x = int(input())\nif x > 10 and x < 20:\n    print('от 11 до 19')\nelif x == 0:\n    print('ноль')\nelse:\n    print('другое')",
mem:["== сравнивает, = присваивает","and — оба условия, or — хотя бы одно, not — отрицание","После if/elif/else всегда двоеточие и отступ"],
cards:[["Чем == отличается от =?","== проверяет равенство, = записывает значение в переменную"],["Когда выполняется elif?","Только если все предыдущие if/elif были ложными"],["Что в Python считается ложью для числа?","0"]],
quiz:[["x = 15. Что даст x > 10 and x < 20?",["True","False","Ошибку"],0,"Оба условия верны, значит and даёт True."],["Что обязательно в конце строки с if?",["Точка с запятой","Двоеточие","Скобка"],1,"После условия ставится двоеточие, дальше идёт блок с отступом."]],
say:"Объясни, как работает цепочка if / elif / else на примере оценки по баллам."},
{t:"Циклы",s:"while, for, range, break, format",
idea:"Цикл повторяет действия, чтобы не писать одно и то же много раз. while работает, пока условие верно (подходит, когда не знаешь, сколько будет шагов). for i in range(...) работает заданное число раз. range(5) даёт 0,1,2,3,4 (конец не включается!); range(2,10,3) даёт 2,5,8: начало, конец, шаг. break выходит из цикла сразу, continue пропускает текущий шаг. Ещё в этой лекции форматирование: \"{0:>10}\".format(x) выравнивает по правому краю в поле шириной 10, а {:.2f} показывает 2 знака после запятой.",
code:"for i in range(1, 6):\n    print(i)\n\ns = 0\nwhile s < 10:\n    s += 3\nprint(s)   # 12\n\nprint('{0:.2f}'.format(3.14159))   # 3.14\nprint('{0:>8}'.format('Python'))   # справа",
mem:["range(a, b, step): b не включается","while — пока условие верно, for — заданное число раз","break — выйти, continue — перейти к следующему шагу"],
cards:[["Что выведет for i in range(3)?","0, 1, 2"],["В чём разница break и continue?","break завершает весь цикл, continue пропускает только текущий шаг"],["Что делает {0:.2f} в format?","Выводит число с двумя знаками после запятой"]],
quiz:[["Какие числа даст range(2, 10, 3)?",["2, 5, 8","2, 5, 8, 10","3, 6, 9"],0,"Начинаем с 2, шаг 3, до 10 не включая: 2, 5, 8."],["Как выйти из бесконечного while 1?",["stop","exit цикла через break","continue"],1,"break немедленно прерывает цикл."]],
say:"Объясни, когда нужен while, а когда for, и почему range(5) заканчивается на 4."},
{t:"Строки",s:"индексы, срезы, методы",
idea:"Строка — последовательность символов в кавычках. У каждого символа есть номер (индекс), счёт идёт с 0: в 'python' буква p имеет индекс 0, а последняя — индекс -1. Срез s[i:j:k] берёт кусок: от i до j (j не включается) с шагом k. Строки можно склеивать (+) и повторять (*). Важно: строки неизменяемы, то есть s[0] = 'x' даст ошибку, а методы вроде upper() возвращают новую строку. Полезные методы: len(s) — длина, upper/lower — регистр, find — поиск, replace — замена, split — разрезать на части.",
code:"s = 'python'\ns[0]       # 'p'\ns[-1]      # 'n'\ns[1:4]     # 'yth'\ns[::-1]    # 'nohtyp' (задом наперёд)\nlen(s)     # 6\ns.upper()  # 'PYTHON'\n'ab' * 3   # 'ababab'\ns = s.upper()   # результат надо сохранить!",

{s:"ЛР0",t:"ЛР0. Среда: WSL, VS Code, консоль",task:"Настроить рабочее окружение (WSL, VS Code, тулчейн C++), освоить консоль и скомпилировать простейшую программу.",th:"WSL даёт Linux внутри Windows. Команды консоли: pwd (где я), ls (что тут), cd (перейти), mkdir (папка), touch (файл), rm (удалить). Тулчейн это набор инструментов: компилятор g++ и другие.",code:"#include <iostream>\nint main() {\n    std::cout << \"Hello, world!\" << std::endl;\n    return 0;\n}\n// компиляция: g++ hello.cpp -o hello\n// запуск: ./hello",ex:"#include подключает ввод-вывод, main это точка входа, std::cout печатает текст, return 0 говорит, что программа завершилась успешно.",gd:"1. Установи WSL (в PowerShell от администратора: wsl --install). 2. Поставь VS Code и расширения для WSL и C++. 3. Создай hello.cpp. 4. В консоли: g++ hello.cpp -o hello, потом ./hello.",keys:[[/#include\s*<iostream>/,"#include <iostream>"],[/int\s+main/,"main"],[/cout/,"cout"],[/return\s+0/,"return 0"]],
q:[["Что такое WSL и зачем он нужен?","Windows Subsystem for Linux: слой совместимости, позволяющий работать в Linux-окружении прямо из Windows. Нужен, чтобы выполнять лабораторные в POSIX-совместимой среде.","Linux внутри Windows."],["Какими командами ориентироваться в консоли?","pwd показывает текущую папку, ls список файлов, cd переходит в папку, mkdir создаёт папку, touch создаёт файл, rm удаляет.","Первые буквы английских слов."],["Как скомпилировать и запустить hello.cpp?","g++ hello.cpp -o hello, затем ./hello","Компилятор g++, ключ -o задаёт имя результата."]]},
{s:"Git",t:"Git и GitHub",task:"Настроить ssh-соединение с GitHub, создать свой репозиторий и отправить в него файл с кодом.",th:"ssh-ключ позволяет входить в GitHub без пароля: приватный ключ остаётся у тебя, публичный добавляется в настройки аккаунта. Файлы отправляют тремя командами: add, commit, push.",code:"git --version\nssh-keygen -t ed25519 -C \"your_email@example.com\"\ngit add .\ngit commit -m \"Lab 1\"\ngit push",ex:"git add . готовит изменения, git commit фиксирует их с сообщением, git push отправляет коммит в репозиторий на GitHub.",gd:"1. Создай ключ командой ssh-keygen. 2. Скопируй публичный ключ в GitHub (Settings, SSH and GPG keys). 3. Создай репозиторий. 4. Положи файл, выполни add, commit, push.",keys:[[/git\s+add/,"git add"],[/git\s+commit/,"git commit"],[/git\s+push/,"git push"]],
q:[["Зачем нужен ssh-ключ для GitHub?","Чтобы входить в GitHub без пароля. Приватный ключ хранится у тебя, публичный добавляется в настройки аккаунта.","Вход без пароля."],["Какие команды нужны, чтобы отправить работу в репозиторий?","git add . (добавить), git commit -m \"сообщение\" (зафиксировать), git push (отправить).","Три команды подряд."],["Почему нельзя настраивать ssh на общем компьютере?","Приватный ключ лежит на устройстве, и другие пользователи получат доступ к твоему аккаунту.","Кто ещё сидит за этим компьютером?"]]},
{s:"ЛР1",t:"ЛР1. Ветвления: стоимость звонка",task:"Рассчитать стоимость междугороднего звонка с учётом длительности, времени суток, дня недели, скидок (60 минут 10%, постоянный клиент +5%) и НДС 20%. Использовать вложенные ветвления, проверить ввод, вывести подробный чек.",th:"if / else if / else выбирают ветку по условию, ветвления можно вкладывать. Условия соединяют через && и ||. Для вывода денег: fixed и setprecision(2) из <iomanip>.",code:"#include <iostream>\n#include <iomanip>\nusing namespace std;\nint main() {\n    double minutes; int hour, day, regular;\n    cout << \"Длительность (мин): \"; cin >> minutes;\n    cout << \"Час начала (0-23): \"; cin >> hour;\n    cout << \"День недели (1-7): \"; cin >> day;\n    cout << \"Постоянный клиент (1/0): \"; cin >> regular;\n    if (minutes <= 0 || hour < 0 || hour > 23) {\n        cout << \"Ошибка ввода\" << endl;\n        return 1;\n    }\n    double rate;\n    if (day >= 6) rate = 2;\n    else {\n        if (hour >= 8 && hour < 22) rate = 5;\n        else rate = 3;\n    }\n    double base = minutes * rate;\n    double d1 = minutes >= 60 ? base * 0.10 : 0;\n    double d2 = regular == 1 ? (base - d1) * 0.05 : 0;\n    double total = base - d1 - d2;\n    double vat = total * 0.2;\n    cout << fixed << setprecision(2);\n    cout << \"Базовая стоимость: \" << base << endl;\n    cout << \"Итого без НДС: \" << total << endl;\n    cout << \"К ОПЛАТЕ: \" << total + vat << endl;\n    return 0;\n}",ex:"Сначала проверяем ввод. Тариф выбираем вложенными if: выходные (2 руб), будни днём (5), ночью (3). Скидка за 60 минут считается от базы, скидка постоянному клиенту от остатка (так в примере задания). Потом НДС и вывод.",gd:"1. Прочитай тарифы. 2. Нарисуй блок-схему ветвлений. 3. Напиши ввод и проверку. 4. Напиши выбор тарифа. 5. Посчитай скидки и НДС. 6. Сравни свой вывод с примером из задания (75 мин, 14 ч, среда, клиент 1 даёт 384.74).",keys:[[/#include\s*<iomanip>/,"iomanip"],[/if\s*\(/,"if"],[/else/,"else"],[/setprecision/,"setprecision"],[/cin\s*>>/,"cin"],[/\|\||&&/,"логические && или ||"]],
q:[["Как работает вложенное ветвление?","Внутри блока if или else находится ещё один if. Сначала выбираем ветку по первому условию (будни или выходные), затем уточняем внутри (день или ночь).","Ветвление внутри ветвления."],["В чём разница между = и == ? Что будет при if (x = 5)?","= присваивает, == сравнивает. if (x = 5) записывает 5 в x и всегда истинно: типичная ошибка.","Одно присваивает, другое сравнивает."],["Как проверить корректность ввода?","Перед расчётом проверить диапазоны: if (hour < 0 || hour > 23 || minutes <= 0), вывести ошибку и завершить программу.","Проверка до вычислений."],["Что делают fixed и setprecision(2)?","fixed включает запись с фиксированной точкой, setprecision(2) оставляет два знака после запятой. Нужен #include <iomanip>.","Два знака после точки."]]},
{s:"ЛР2",t:"ЛР2. Циклы: корень уравнения и ряд Тейлора",task:"Задание 1: найти корень x - cos(x) = 0 методом половинного деления с погрешностью 1e-4. Задание 2: для своего варианта посчитать сумму ряда Тейлора для x от 0 до 1 с шагом 0.2, сравнить с табличной функцией, вывести таблицу X, Y(x), S(x), N. Каждое задание в отдельной функции.",th:"for для известного числа шагов, while проверяет условие до тела, do-while после. Следующий член ряда считают через предыдущий (умножением на коэффициент), чтобы не считать факториалы. Заканчивают, когда член меньше погрешности. Нужны <cmath> и <iomanip>.",code:"#include <iostream>\n#include <cmath>\n#include <iomanip>\ndouble f(double x) { return x - cos(x); }\ndouble bisect(double l, double r, double eps) {\n    while (r - l > eps) {\n        double m = (l + r) / 2;\n        if (f(l) * f(m) <= 0) r = m;\n        else l = m;\n    }\n    return (l + r) / 2;\n}\ndouble taylorSin(double x, double eps, int &n) {\n    double term = x, sum = x;\n    n = 1;\n    while (std::fabs(term) >= eps) {\n        term = -term * x * x / ((2 * n) * (2 * n + 1));\n        sum += term;\n        n++;\n    }\n    return sum;\n}\nint main() {\n    std::cout << std::fixed << std::setprecision(5) << bisect(0, 1, 1e-4) << std::endl;\n    for (double x = 0; x <= 1.0001; x += 0.2) {\n        int n;\n        double s = taylorSin(x, 1e-6, n);\n        std::cout << std::setw(10) << x << std::setw(10) << sin(x) << std::setw(10) << s << std::setw(4) << n << std::endl;\n    }\n}",ex:"bisect делит отрезок пополам и оставляет половину, где функция меняет знак. taylorSin хранит текущий член term и сумму sum, а каждый следующий член получает из предыдущего домножением на -x²/((2n)(2n+1)). Пример показан для sin(x), твой вариант считается по формуле из задания.",gd:"1. Реши задание 1 функцией bisect. 2. Узнай свой вариант (номер по модулю 13). 3. Выведи формулу коэффициента k на листе и вставь в отчёт. 4. Напиши функцию ряда. 5. Выведи таблицу через setw и setprecision. 6. Сделай блок-схемы.",keys:[[/#include\s*<cmath>/,"cmath"],[/while|for/,"цикл"],[/fabs|abs/,"модуль"],[/setprecision/,"setprecision"],[/setw/,"setw"],[/1e-4|0\.0001/,"погрешность 1e-4"],[/1e-6|0\.000001/,"погрешность 1e-6"]],
q:[["Чем отличаются for, while и do-while?","for нужен при известном числе итераций. while проверяет условие до тела и может не выполниться ни разу. do-while проверяет после тела, значит выполнится минимум один раз.","Когда проверяется условие?"],["В чём идея метода половинного деления?","Берём отрезок [L, R], где f(L)·f(R) < 0. Делим пополам, оставляем половину со сменой знака и повторяем, пока R - L не станет меньше 1e-4.","Корень зажат между знаками."],["Почему член ряда Тейлора считают через предыдущий?","Факториалы и степени быстро растут и переполняют число. Умножение предыдущего члена на коэффициент k быстрее и точнее.","Что быстро растёт?"],["Когда заканчивать суммирование ряда?","Когда модуль очередного члена меньше заданной погрешности (1e-6).","Член стал совсем маленьким."],["Что делают setw, setprecision, fixed?","setw задаёт ширину поля, setprecision число знаков, fixed формат с фиксированной точкой. Нужен #include <iomanip>.","Заголовок iomanip."]]},
{s:"ЛР3",t:"ЛР3. Сортировка массива",task:"Реализовать сортировку выбором и пузырьком, заполнение случайными числами 0..99 и вывод в отдельных функциях. Для массива из 5-10 элементов вывести исходный, затем трижды отсортировать (по возрастанию, повторно по возрастанию, по убыванию) обоими методами, показывая массив, число перестановок и сравнений.",th:"Статический массив имеет размер, известный при компиляции. В функцию массив передают как указатель (int a[]) вместе с размером. Индексы и размеры хранят в size_t. Случайные числа: srand(time(NULL)) один раз, затем rand() % 100.",code:"#include <iostream>\n#include <cstdlib>\n#include <ctime>\n#include <algorithm>\nvoid fill(int a[], size_t n) { for (size_t i = 0; i < n; i++) a[i] = rand() % 100; }\nvoid print(const int a[], size_t n) { for (size_t i = 0; i < n; i++) std::cout << a[i] << ' '; std::cout << '\\n'; }\nvoid selectionSort(int a[], size_t n, bool asc, int &sw, int &cmp) {\n    sw = cmp = 0;\n    for (size_t i = 0; i + 1 < n; i++) {\n        size_t m = i;\n        for (size_t j = i + 1; j < n; j++) {\n            cmp++;\n            if (asc ? a[j] < a[m] : a[j] > a[m]) m = j;\n        }\n        if (m != i) { std::swap(a[i], a[m]); sw++; }\n    }\n}\nvoid bubbleSort(int a[], size_t n, bool asc, int &sw, int &cmp) {\n    sw = cmp = 0;\n    for (size_t i = 0; i + 1 < n; i++) {\n        bool changed = false;\n        for (size_t j = 0; j + 1 < n - i; j++) {\n            cmp++;\n            if (asc ? a[j] > a[j + 1] : a[j] < a[j + 1]) { std::swap(a[j], a[j + 1]); sw++; changed = true; }\n        }\n        if (!changed) break;\n    }\n}\nint main() {\n    srand(time(NULL));\n    const size_t N = 8;\n    int a[N], b[N], sw, cmp;\n    fill(a, N); print(a, N);\n    std::copy(a, a + N, b);\n    selectionSort(a, N, true, sw, cmp); print(a, N);\n    std::cout << sw << ' ' << cmp << '\\n';\n    bubbleSort(b, N, true, sw, cmp); print(b, N);\n    std::cout << sw << ' ' << cmp << '\\n';\n}",ex:"Выбор: ищем минимум в неотсортированной части и ставим его на место. Пузырёк: сравниваем соседей и меняем местами, флаг changed позволяет выйти раньше. Счётчики sw и cmp передаются по ссылке. В main показан первый проход, остальные два делаются так же, при этом каждый метод получает копию одного и того же массива.",gd:"1. Напиши fill и print. 2. Напиши selectionSort со счётчиками. 3. Напиши bubbleSort. 4. В main заведи копии массива, чтобы оба метода получали одинаковые данные. 5. Трижды отсортируй и выводи результат и счётчики. 6. Сделай блок-схемы функций.",keys:[[/srand/,"srand"],[/rand\(\)\s*%\s*100/,"rand() % 100"],[/size_t/,"size_t"],[/swap|tmp|temp/,"обмен элементов"],[/for[\s\S]*for/,"вложенные циклы"],[/&\s*\w*(sw|cmp|cnt|count)/i,"счётчики по ссылке"]],
q:[["Как работает сортировка выбором?","Находит минимум в неотсортированной части и меняет его с первым элементом этой части, затем повторяет для остатка. O(n²), память O(1).","Ищем минимум и ставим на место."],["Как работает пузырьковая сортировка?","Попарно сравнивает соседние элементы и меняет местами, если порядок неверный. Большие элементы всплывают в конец. Лучший случай O(n) при флаге «обменов не было».","Соседи меняются местами."],["Как передать массив в функцию?","void f(int a[], size_t n) или int* a: передаётся указатель на первый элемент, размер передают отдельно.","Имя массива это указатель."],["Как получить случайные числа от 0 до 99?","#include <cstdlib> и <ctime>; srand(time(NULL)) один раз в начале; потом rand() % 100.","Остаток от деления."]]},
{s:"ЛР4",t:"ЛР4. Матрицы",task:"Обработать матрицу по своему варианту (вариант считается по формуле из методички). Ввод матрицы оформить отдельной функцией, матрица это двумерный массив. Пример варианта 20: для каждой строки найти количество элементов больше среднего арифметического строки и их сумму. На защите нужно написать похожую программу в аудитории.",th:"Двумерный массив double a[10][12]. В функцию его передают как double a[][12], число столбцов обязательно, число строк нет. Матрицу обходят вложенными циклами: внешний по строкам, внутренний по столбцам.",code:"#include <iostream>\n#include <iomanip>\nconst int MAXM = 10, MAXN = 12;\nvoid inputMatrix(double t[][MAXN], int m, int n) {\n    for (int i = 0; i < m; i++)\n        for (int j = 0; j < n; j++)\n            std::cin >> t[i][j];\n}\nint main() {\n    double t[MAXM][MAXN];\n    int m, n;\n    std::cin >> m >> n;\n    inputMatrix(t, m, n);\n    for (int i = 0; i < m; i++) {\n        double avg = 0;\n        for (int j = 0; j < n; j++) avg += t[i][j];\n        avg /= n;\n        int cnt = 0;\n        double sum = 0;\n        for (int j = 0; j < n; j++) {\n            std::cout << std::setw(8) << t[i][j];\n            if (t[i][j] > avg) { cnt++; sum += t[i][j]; }\n        }\n        std::cout << std::setw(10) << avg << std::setw(5) << cnt << std::setw(10) << sum << '\\n';\n    }\n}",ex:"inputMatrix читает матрицу. Для каждой строки считаем среднее, затем второй проход: печатаем элемент и, если он больше среднего, увеличиваем счётчик и сумму. После элементов строки выводим среднее, количество и сумму, как требует вариант.",gd:"1. Узнай свой вариант. 2. Напиши функцию ввода матрицы. 3. Реши задачу для одной строки, потом оберни циклом по строкам. 4. Оформи вывод через setw. 5. Нарисуй блок-схемы, сделай скриншоты. 6. Потренируйся писать похожие варианты без подсказок.",keys:[[/\[\s*\w+\s*\]\s*\[/,"двумерный массив a[i][j]"],[/cin\s*>>/,"ввод cin"],[/void\s+\w+\s*\(/,"отдельная функция"],[/for[\s\S]*for/,"вложенные циклы"],[/setw/,"setw"]],
q:[["Как объявить двумерный массив и передать его в функцию?","double a[10][12]; в функцию: void f(double a[][12], int m, int n). Число столбцов указывать обязательно, число строк нет.","Одна размерность обязательна."],["Как обойти матрицу?","Вложенными циклами: внешний по строкам i, внутренний по столбцам j. Элемент это a[i][j].","Цикл в цикле."],["Как найти среднее арифметическое строки?","Сложить элементы строки в цикле и разделить на n: avg = sum / n.","Сумма делить на количество."],["Что нужно уметь на защите?","Написать в аудитории программу, похожую на один из вариантов: ввод матрицы функцией, обработка строк, вывод.","Нужно писать с нуля."]]},
{s:"ДЗ",t:"ДЗ. Шифр Цезаря с кодовым блокнотом",task:"Закодировать и раскодировать текст шифром Цезаря с переменным сдвигом: сдвиг для позиции равен сумме кодов слова блокнота по модулю 128. Собрать массив ключей (20 элементов) отдельной функцией, вести статистику кодировок в stat[128][128], вывести таблицу повторяемости. Файлы: source.txt, key.txt, encoded.txt, decoded.txt.",th:"Код символа char это число ASCII (0..127). Ключ слова = сумма кодов % 128. Кодирование: (код + ключ[i % 20]) % 128, декодирование: (код - ключ + 128) % 128. Файлы читают через ifstream, пишут через ofstream (#include <fstream>).",code:"#include <iostream>\n#include <fstream>\n#include <string>\nint stat[128][128];\nint keys[20];\nvoid makeKeys() {\n    std::ifstream f(\"key.txt\");\n    std::string w;\n    for (int i = 0; i < 20 && f >> w; i++) {\n        int s = 0;\n        for (char c : w) s += c;\n        keys[i] = s % 128;\n    }\n}\nint main() {\n    makeKeys();\n    std::ifstream in(\"source.txt\");\n    std::ofstream out(\"encoded.txt\");\n    char c;\n    int k = 0;\n    while (in.get(c)) {\n        char e = (c + keys[k % 20]) % 128;\n        stat[(int)c][(int)e]++;\n        out << e;\n        k++;\n    }\n}",ex:"makeKeys превращает каждое слово блокнота в число: сумма кодов букв % 128. В main читаем исходный файл по символу, кодируем с ключом по кругу (k % 20) и записываем. stat[c][e]++ считает, сколько раз символ c превратился в e. Раскодирование делается обратной формулой и записывает decoded.txt.",gd:"1. Напиши makeKeys. 2. Напиши кодирование с записью в encoded.txt и статистикой. 3. Напиши раскодирование в decoded.txt и проверь, что оно совпадает с source.txt. 4. Выведи таблицу статистики: символ, сколько в исходном, сколько вариантов, размер блокнота, длина текста. 5. Блок-схемы и скриншоты.",keys:[[/ifstream/,"чтение файла ifstream"],[/ofstream/,"запись файла ofstream"],[/%\s*128/,"остаток от деления на 128"],[/stat\s*\[/,"массив stat"],[/keys?\s*\[/,"массив ключей"]],

[2,"Что такое множественный выбор?","Выбор одного варианта из многих цепочкой if-elif-...-else."],
[2,"В чём разница между = и ==?","= присваивает значение переменной, == сравнивает два значения и даёт True или False."],
[2,"Как упростить код: if Number == 0: print('Нет результата') и отдельный if Number != 0: print(1/Number)?","Условия взаимоисключающие, поэтому нужен if-else:\nif Number == 0:\n    print('Нет результата')\nelse:\n    print(1 / Number)"],
[3,"Что такое «цикл»?","Многократное повторение блока команд (тела цикла) по набору значений или пока выполняется условие."],
[3,"В каких случаях используют инструкцию for? Каков её общий вид?","Когда число повторений известно или нужно перебрать элементы последовательности. Вид: for переменная in последовательность: тело цикла."],
[3,"Что такое переменная цикла for, тело цикла? Что может быть использовано в качестве переменной цикла?","Переменная цикла по очереди принимает значения последовательности. Тело цикла это блок с отступом, который повторяется на каждом шаге. Перебирать можно range, строку, список, множество, словарь."],
[3,"Как оформить range(), если нужны все значения: а) от 0 до n с шагом 1; б) от 4 до k с шагом 1; в) от 19 до 0 с шагом -1; г) от 18 до 8 с шагом -1?","а) range(0, n + 1) или range(n + 1)\nб) range(4, k + 1)\nв) range(19, -1, -1)\nг) range(18, 7, -1)\nКонец диапазона не включается, поэтому его сдвигают на 1."],
[3,"Может ли тело for с range() при шаге 1 не выполниться ни разу?","Да, если диапазон пуст, например range(5, 5) или range(7, 3)."],
[3,"Сколько раз выполнится тело: for a in range(1, 10); for b in range(10, 20); for i in range(n, m) при m ≥ n?","range(1, 10): 9 раз\nrange(10, 20): 10 раз\nrange(n, m): m - n раз (при m == n ни разу)."],
[3,"Всегда ли for можно заменить на while? А наоборот?","for на while можно заменить всегда. while на for не всегда: если число повторений заранее неизвестно и зависит от данных."],
[3,"Что такое «зацикливание программы»? В каком случае оно может произойти?","Цикл никогда не завершается, потому что условие всегда истинно. Например, в while забыли менять переменную из условия."],
[7,"Что такое функция?","Именованный блок кода, который можно вызывать много раз, передавая параметры и получая результат."],
[7,"Способы создания функций в Python.","Оператор def (обычная функция) и lambda (анонимная однострочная функция)."],
[7,"Пустая функция.","Функция, в теле которой только pass: def f(): pass. Это заготовка, она ничего не делает."],
[7,"Оператор return.","Возвращает результат вызывающему коду и завершает функцию. Без return функция вернёт None. Через запятую можно вернуть несколько значений (кортеж)."],
[7,"Lambda-функция.","Короткая функция без имени из одного выражения: f = lambda x, y: x + y. Результат выражения возвращается сам."],
[7,"Обязательные аргументы (Required arguments).","Параметры без значения по умолчанию. При вызове их нужно передать и в том же порядке: def f(a, b), вызов f(1, 2)."],
[7,"Аргументы-ключевые слова (Keyword arguments).","Передача по имени параметра: f(b=2, a=1). Порядок не важен."],
[7,"Аргументы по умолчанию (Default arguments).","Параметр со значением в определении: def f(a, b=10). Если b не передали, берётся 10."],
[7,"Аргументы произвольной длины (Variable-length arguments).","*args собирает лишние позиционные аргументы в кортеж, **kwargs собирает именованные в словарь."],
[7,"Область видимости переменных.","Локальные переменные существуют только внутри функции, глобальные объявлены вне функций и видны везде. Чтобы изменить глобальную внутри функции, пишут global имя."],
[8,"Какие операции и операторы используются при работе с файлами?","open() открывает файл (режимы r, w, a, b), read, readline, readlines читают, write и writelines пишут, close закрывает, with закрывает автоматически, for line in f читает построчно."],
[8,"Необходимо ли использовать процедуру закрытия файла?","Да. Закрытие сохраняет записанные данные и освобождает файл. Удобнее конструкция with: она закроет файл сама."],
[8,"Какие библиотеки используются для работы с файлами?","Базовые open и методы файла встроены и импорта не требуют. Для путей и файлов системы используют os, os.path, pathlib, для копирования shutil, для сохранения объектов pickle, для форматов csv и json."],
[9,"Как создать множество конструктором и генератором?","Конструктором: a = set('любое множество'). Генератором: b = {u for u in range(1, 10, 2)}."],
[9,"Чем add() отличается от remove() у множества?","add(x) добавляет элемент. remove(x) удаляет элемент и вызывает ошибку, если его нет (discard ошибки не даёт)."],
[9,"Изменит ли a.union(b) множество a?","Нет. union() возвращает новое множество, поэтому результат надо сохранить: c = a.union(b). Чтобы изменить a, используют a.update(b)."]];
