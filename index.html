<style>
:root{color-scheme:light;--bg:#f6f8ff;--ink:#26234a;--mut:#6b6990;--acc:#5b5bd6;--acc2:#e9e8ff;--ok:#16895c;--okb:#dff5ea;--bad:#c2410c;--badb:#ffe8dc;--line:#dcdff5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;line-height:1.15;margin:.2em 0}

.mut{color:var(--mut)}

.lc:hover,.lc:focus-visible{border-color:var(--acc);outline:none}
.lc b{display:block;font-size:1.05rem}
.bar{height:8px;background:var(--acc2);border-radius:9px;overflow:hidden;margin-top:8px}

.box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}

.card{cursor:pointer;user-select:none}

.card.open .a{display:block}

.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font:inherit;cursor:pointer;color:inherit}
.opt.ok{border-color:var(--ok);background:var(--okb)}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.st.d{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
html[data-theme=mint]{--bg:#f0fbf6;--ink:#17372c;--mut:#4f7667;--acc:#0f8a6f;--acc2:#d9f5ea;--line:#cfeadf}

html[data-theme=sky]{--bg:#eef8ff;--ink:#12354d;--mut:#4f7390;--acc:#1565c0;--acc2:#d8ecfc;--line:#cfe3f3}
html[data-theme=rose]{--bg:#fff0f6;--ink:#4a1f36;--mut:#88566f;--acc:#d6336c;--acc2:#ffdcea;--line:#f5cfdf}
#hd{max-width:760px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hl{display:flex;gap:6px;flex-wrap:wrap}.hl span{background:#fff;border:2px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.85rem;font-weight:700}
.dots{display:flex;gap:8px}.dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}.dot.on{box-shadow:0 0 0 3px var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;font-weight:800;border-radius:12px;padding:10px 18px;z-index:9;max-width:90vw;text-align:center}
.acts{display:grid;gap:10px;margin:14px 0}.big2{padding:14px 16px;font-size:1.1rem}
.snake{display:flex;gap:4px;align-items:center;margin:12px 0;font-size:1.5rem}.seg{flex:1;height:28px;background:var(--acc2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}.seg b{display:block;width:100%;background:var(--acc)}
.tabs{display:flex;gap:6px}
.big{min-height:170px}.big b{font-size:1.25rem;display:block;margin:6px 0}.big .a{display:none;margin-top:10px;color:var(--acc);font-weight:700;font-size:1.1rem;white-space:pre-wrap}.big.open .a{display:block}.big.open .hint{display:none}.big .b{margin-top:10px}
.act{display:flex;gap:10px;margin-top:10px}.act .b{flex:1;padding:16px;font-size:1.05rem}
main{padding-bottom:110px}
html[data-theme=dark]{color-scheme:dark;--bg:#15132a;--ink:#ecebff;--mut:#aaa8d2;--acc:#8f8fff;--acc2:#2b2852;--line:#3a3670;--ok:#4ade9d;--okb:#123a2d;--bad:#ff9a6b;--badb:#3e2418;--card:#201d40}
html[data-dk=1] .lc,html[data-dk=1] pre,html[data-dk=1] .box,html[data-dk=1] .opt,html[data-dk=1] textarea,html[data-dk=1] .st,html[data-dk=1] .hl span{background:var(--card)}
html[data-dk=1] .box.rem{background:var(--acc2)}
html[data-dk=1] .box.known,html[data-dk=1] .st.d,html[data-dk=1] .opt.ok{background:var(--okb)}
html[data-dk=1] .opt.no{background:var(--badb)}
html[data-dk=1] button.b,html[data-dk=1] .toast{color:#15132a}
html[data-dk=1] button.b.g{color:var(--acc)}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card,#fff);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nv button{flex:1;background:none;border:0;font:inherit;color:var(--mut);padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
#nv button.on{color:var(--acc);font-weight:800}#nv span{font-size:1.35rem;line-height:1.2}#nv .t{font-size:.72rem}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.conf{position:fixed;top:-30px;font-size:1.6rem;z-index:9;pointer-events:none}
.hintp{color:var(--mut);font-style:italic}.tx{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

html[data-theme=samurai]{--bg:#14110f;--ink:#f4ece6;--mut:#b9a99d;--acc:#ff4d5a;--acc2:#3a1f22;--line:#4a3a36;--card:#201b19}
html[data-theme=steel]{--bg:#0e1621;--ink:#e8eef6;--mut:#9fb0c4;--acc:#4aa3ff;--acc2:#1c2c42;--line:#2c405a;--card:#162234}
html[data-theme=neon]{--bg:#07100a;--ink:#d9ffd2;--mut:#86c97c;--acc:#39ff14;--acc2:#12301a;--line:#1d5a2a;--card:#0d1d12}
html[data-dk=1] .chip.on{color:#15132a}
body::before{position:fixed;top:64px;right:10px;font-size:1.3rem;opacity:.55;pointer-events:none;z-index:0}
html[data-theme=sakura] body::before{content:"🌸 🎀 🌸"}html[data-theme=bow] body::before{content:"🎀 ✨ 🎀"}html[data-theme=samurai] body::before{content:"⚔️ 🏯"}html[data-theme=steel] body::before{content:"⚙️ 🔧"}html[data-theme=neon] body::before{content:"👾 ⚡"}
.dot{width:22px;height:22px}.dots{flex-wrap:wrap;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin:6px 0}
.chip{flex:none;border:2px solid var(--line);background:var(--card,#fff);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.inp{display:block;width:100%;padding:11px 12px;margin:8px 0;border:2px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:var(--card,#fff)}
.petv{position:relative;width:170px;height:170px;margin:10px auto;text-align:center}.pe{font-size:6.5rem;line-height:170px;display:inline-block}
.ph{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:3rem}.pf{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:2.6rem}
@media(prefers-reduced-motion:no-preference){.pe{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}

<script>
var L=[
{t:"Среда и первые программы",s:"IDLE, print, input, числа",
idea:"Python — язык, на котором ты даёшь компьютеру команды. IDLE — программа, где ты их пишешь. Есть два режима: интерактивный (окно с >>>, каждая команда выполняется сразу, как калькулятор) и файл с программой (пишешь много команд, потом запускаешь через F5). Переменная — это коробочка с именем, в которой лежит значение: x = 5. Всё, что после #, — комментарий, Python его пропускает. Главное, что надо знать: input() всегда возвращает строку, поэтому число из него надо превратить через int() или float().",
code:"a = int(input('Введите a: '))\nb = int(input('Введите b: '))\nprint('Сумма =', a + b)\n\n20 / 3    # 6.666... (деление всегда дробное)\n20 // 3   # 6   (целая часть)\n20 % 3    # 2   (остаток)\n3 ** 4    # 81  (степень)",
mem:["/ — обычное деление, // — целая часть, % — остаток, ** — степень","input() даёт строку, число делаем через int() или float()","= это не «равно», а «положи значение в переменную»"],
cards:[["Что делает //?","Целочисленное деление: 20 // 3 = 6"],["Что вернёт input()?","Всегда строку (str), даже если ввели 5"],["Для чего нужен #?","Комментарий: Python его не выполняет"]],
quiz:[["Чему равно 20 // 3?",["6.67","6","2"],1,"// отбрасывает дробную часть. Остаток от деления — это %."],["Как правильно прочитать целое число?",["a = input()","a = int(input())","a = str(input())"],1,"input() даёт строку, int() превращает её в число."]],
say:"Объясни подруге, чем отличаются /, // и %, и почему input() надо оборачивать в int()."},
{t:"Условные операторы",s:"if, elif, else, and, or, not",
idea:"Условие — это вопрос, на который отвечают «да» (True) или «нет» (False). Сравнения: ==, !=, >, <, >=, <=. Помни: один = кладёт значение, два == сравнивает. Условия можно склеивать: and (оба верны), or (хотя бы одно верно), not (наоборот). if выполняет блок, если условие верно; elif проверяется, только если предыдущие были ложны; else — если ничего не подошло. Блок выделяется отступом (4 пробела) и двоеточием в конце строки. В Python 0 считается ложью, любое другое число — истиной.",
code:"x = int(input())\nif x > 10 and x < 20:\n    print('от 11 до 19')\nelif x == 0:\n    print('ноль')\nelse:\n    print('другое')",
mem:["== сравнивает, = присваивает","and — оба условия, or — хотя бы одно, not — отрицание","После if/elif/else всегда двоеточие и отступ"],
cards:[["Чем == отличается от =?","== проверяет равенство, = записывает значение в переменную"],["Когда выполняется elif?","Только если все предыдущие if/elif были ложными"],["Что в Python считается ложью для числа?","0"]],
quiz:[["x = 15. Что даст x > 10 and x < 20?",["True","False","Ошибку"],0,"Оба условия верны, значит and даёт True."],["Что обязательно в конце строки с if?",["Точка с запятой","Двоеточие","Скобка"],1,"После условия ставится двоеточие, дальше идёт блок с отступом."]],
say:"Объясни, как работает цепочка if / elif / else на примере оценки по баллам."},
{t:"Циклы",s:"while, for, range, break, format",
idea:"Цикл повторяет действия, чтобы не писать одно и то же много раз. while работает, пока условие верно (подходит, когда не знаешь, сколько будет шагов). for i in range(...) работает заданное число раз. range(5) даёт 0,1,2,3,4 (конец не включается!); range(2,10,3) даёт 2,5,8: начало, конец, шаг. break выходит из цикла сразу, continue пропускает текущий шаг. Ещё в этой лекции форматирование: \"{0:>10}\".format(x) выравнивает по правому краю в поле шириной 10, а {:.2f} показывает 2 знака после запятой.",
code:"for i in range(1, 6):\n    print(i)\n\ns = 0\nwhile s < 10:\n    s += 3\nprint(s)   # 12\n\nprint('{0:.2f}'.format(3.14159))   # 3.14\nprint('{0:>8}'.format('Python'))   # справа",
mem:["range(a, b, step): b не включается","while — пока условие верно, for — заданное число раз","break — выйти, continue — перейти к следующему шагу"],
cards:[["Что выведет for i in range(3)?","0, 1, 2"],["В чём разница break и continue?","break завершает весь цикл, continue пропускает только текущий шаг"],["Что делает {0:.2f} в format?","Выводит число с двумя знаками после запятой"]],
quiz:[["Какие числа даст range(2, 10, 3)?",["2, 5, 8","2, 5, 8, 10","3, 6, 9"],0,"Начинаем с 2, шаг 3, до 10 не включая: 2, 5, 8."],["Как выйти из бесконечного while 1?",["stop","exit цикла через break","continue"],1,"break немедленно прерывает цикл."]],
say:"Объясни, когда нужен while, а когда for, и почему range(5) заканчивается на 4."},
{t:"Строки",s:"индексы, срезы, методы",
idea:"Строка — последовательность символов в кавычках. У каждого символа есть номер (индекс), счёт идёт с 0: в 'python' буква p имеет индекс 0, а последняя — индекс -1. Срез s[i:j:k] берёт кусок: от i до j (j не включается) с шагом k. Строки можно склеивать (+) и повторять (*). Важно: строки неизменяемы, то есть s[0] = 'x' даст ошибку, а методы вроде upper() возвращают новую строку. Полезные методы: len(s) — длина, upper/lower — регистр, find — поиск, replace — замена, split — разрезать на части.",
code:"s = 'python'\ns[0]       # 'p'\ns[-1]      # 'n'\ns[1:4]     # 'yth'\ns[::-1]    # 'nohtyp' (задом наперёд)\nlen(s)     # 6\ns.upper()  # 'PYTHON'\n'ab' * 3   # 'ababab'\ns = s.upper()   # результат надо сохранить!",
mem:["Индексы с 0, а -1 — последний символ","Срез s[i:j]: j не входит","Строки неизменяемы: метод возвращает новую строку, её нужно сохранить"],
cards:[["Что даст s[::-1]?","Строку задом наперёд"],["Можно ли изменить s[0] = 'x'?","Нет, строки неизменяемы (будет ошибка)"],["Что делает len(s)?","Возвращает количество символов в строке"]],
quiz:[["s = 'python'. Что такое s[1:4]?",["'pyt'","'yth'","'ytho'"],1,"Индексы 1, 2, 3: y, t, h. Индекс 4 не берётся."],["Что нужно, чтобы s стала заглавными?",["s.upper()","s = s.upper()","upper(s)"],1,"Метод не меняет строку, а возвращает новую, поэтому присваиваем."]],
say:"Объясни, что такое индекс и срез, и почему строку нельзя изменить «на месте»."},
{t:"Списки",s:"[], append, pop, sort, цикл по списку",
idea:"Список — это набор значений под одним именем, в квадратных скобках: a = [3, 1, 2]. Элементы нумеруются с 0, как в строках, работают и срезы. В отличие от строки, список можно менять. Главное: append(x) добавляет в конец, insert(i, x) вставляет на место i, remove(x) удаляет значение, pop(i) удаляет по индексу и возвращает элемент, sort() сортирует на месте. Также len, min, max, sum. Пройти по списку: for x in a. Из строки список получают через split: 'a,b,c'.split(',').",
code:"a = [3, 1, 2]\na.append(5)     # [3, 1, 2, 5]\na.sort()        # [1, 2, 3, 5]\na.pop()         # убрал и вернул 5\nprint(len(a), sum(a), max(a))\nfor x in a:\n    print(x * 2)\n'a,b,c'.split(',')   # ['a', 'b', 'c']",
mem:["append — в конец, insert(i, x) — в нужное место","remove убирает по значению, pop — по индексу","Список изменяемый, строка нет"],
cards:[["Чем remove отличается от pop?","remove(x) ищет значение x, pop(i) удаляет по индексу и возвращает элемент"],["Как создать список из строки 'a,b,c'?","'a,b,c'.split(',')"],["Как создать список из 5 нулей?","[0] * 5"]],
quiz:[["a = [1, 2, 3]. Что вернёт a.pop()?",["1","3","[1, 2]"],1,"pop() без аргумента убирает и возвращает последний элемент."],["Что даст 'a,b,c'.split(',')?",["'abc'","['a', 'b', 'c']","('a','b','c')"],1,"split превращает строку в список частей."]],
say:"Объясни, чем список отличается от строки и перечисли 4 способа изменить список."},
{t:"Списки и строки вместе",s:"split, join, find, index",
idea:"Эта лекция про то, как строки и списки превращаются друг в друга. split разрезает строку на список, join склеивает список строк в одну строку: ', '.join(['a','b']) даст 'a, b' (разделитель стоит ПЕРЕД join). list('abc') даёт ['a','b','c']. Поиск: find возвращает индекс или -1, если не нашёл, а index в такой ситуации падает с ошибкой ValueError. rfind и rindex ищут с конца. Проверки: isdigit (только цифры), isalpha (только буквы), isalnum. Помни: строка неизменяема, а список можно менять.",
code:"s = 'раз два три'\nw = s.split()            # ['раз','два','три']\n'-'.join(w)               # 'раз-два-три'\nlist('abc')              # ['a','b','c']\n'abc'.find('z')          # -1\n# 'abc'.index('z')       # ValueError!\n'123'.isdigit()          # True",

[2,"Может ли оператор ветвления содержать внутри себя другие ветвления?","Да, ветвления можно вкладывать друг в друга, внутренний блок получает ещё один отступ."],
[2,"Что такое множественный выбор?","Выбор одного варианта из многих цепочкой if-elif-...-else."],
[2,"В чём разница между = и ==?","= присваивает значение переменной, == сравнивает два значения и даёт True или False."],
[2,"Как упростить код: if Number == 0: print('Нет результата') и отдельный if Number != 0: print(1/Number)?","Условия взаимоисключающие, поэтому нужен if-else:\nif Number == 0:\n    print('Нет результата')\nelse:\n    print(1 / Number)"],
[3,"Что такое «цикл»?","Многократное повторение блока команд (тела цикла) по набору значений или пока выполняется условие."],
[3,"В каких случаях используют инструкцию for? Каков её общий вид?","Когда число повторений известно или нужно перебрать элементы последовательности. Вид: for переменная in последовательность: тело цикла."],
[3,"Что такое переменная цикла for, тело цикла? Что может быть использовано в качестве переменной цикла?","Переменная цикла по очереди принимает значения последовательности. Тело цикла это блок с отступом, который повторяется на каждом шаге. Перебирать можно range, строку, список, множество, словарь."],
[3,"Как оформить range(), если нужны все значения: а) от 0 до n с шагом 1; б) от 4 до k с шагом 1; в) от 19 до 0 с шагом -1; г) от 18 до 8 с шагом -1?","а) range(0, n + 1) или range(n + 1)\nб) range(4, k + 1)\nв) range(19, -1, -1)\nг) range(18, 7, -1)\nКонец диапазона не включается, поэтому его сдвигают на 1."],
[3,"Может ли тело for с range() при шаге 1 не выполниться ни разу?","Да, если диапазон пуст, например range(5, 5) или range(7, 3)."],
[3,"Сколько раз выполнится тело: for a in range(1, 10); for b in range(10, 20); for i in range(n, m) при m ≥ n?","range(1, 10): 9 раз\nrange(10, 20): 10 раз\nrange(n, m): m - n раз (при m == n ни разу)."],
[3,"Всегда ли for можно заменить на while? А наоборот?","for на while можно заменить всегда. while на for не всегда: если число повторений заранее неизвестно и зависит от данных."],
[3,"Что такое «зацикливание программы»? В каком случае оно может произойти?","Цикл никогда не завершается, потому что условие всегда истинно. Например, в while забыли менять переменную из условия."],
[7,"Что такое функция?","Именованный блок кода, который можно вызывать много раз, передавая параметры и получая результат."],
[7,"Способы создания функций в Python.","Оператор def (обычная функция) и lambda (анонимная однострочная функция)."],
[7,"Пустая функция.","Функция, в теле которой только pass: def f(): pass. Это заготовка, она ничего не делает."],
[7,"Оператор return.","Возвращает результат вызывающему коду и завершает функцию. Без return функция вернёт None. Через запятую можно вернуть несколько значений (кортеж)."],
[7,"Lambda-функция.","Короткая функция без имени из одного выражения: f = lambda x, y: x + y. Результат выражения возвращается сам."],
[7,"Обязательные аргументы (Required arguments).","Параметры без значения по умолчанию. При вызове их нужно передать и в том же порядке: def f(a, b), вызов f(1, 2)."],
[7,"Аргументы-ключевые слова (Keyword arguments).","Передача по имени параметра: f(b=2, a=1). Порядок не важен."],
[7,"Аргументы по умолчанию (Default arguments).","Параметр со значением в определении: def f(a, b=10). Если b не передали, берётся 10."],
[7,"Аргументы произвольной длины (Variable-length arguments).","*args собирает лишние позиционные аргументы в кортеж, **kwargs собирает именованные в словарь."],
[7,"Область видимости переменных.","Локальные переменные существуют только внутри функции, глобальные объявлены вне функций и видны везде. Чтобы изменить глобальную внутри функции, пишут global имя."],
[8,"Какие операции и операторы используются при работе с файлами?","open() открывает файл (режимы r, w, a, b), read, readline, readlines читают, write и writelines пишут, close закрывает, with закрывает автоматически, for line in f читает построчно."],
[8,"Необходимо ли использовать процедуру закрытия файла?","Да. Закрытие сохраняет записанные данные и освобождает файл. Удобнее конструкция with: она закроет файл сама."],
[8,"Какие библиотеки используются для работы с файлами?","Базовые open и методы файла встроены и импорта не требуют. Для путей и файлов системы используют os, os.path, pathlib, для копирования shutil, для сохранения объектов pickle, для форматов csv и json."],
[9,"Как создать множество конструктором и генератором?","Конструктором: a = set('любое множество'). Генератором: b = {u for u in range(1, 10, 2)}."],
[9,"Чем add() отличается от remove() у множества?","add(x) добавляет элемент. remove(x) удаляет элемент и вызывает ошибку, если его нет (discard ошибки не даёт)."],
[9,"Изменит ли a.union(b) множество a?","Нет. union() возвращает новое множество, поэтому результат надо сохранить: c = a.union(b). Чтобы изменить a, используют a.update(b)."]];
